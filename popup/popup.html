<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Specz - Smart Laptop Buyer</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --card-border: #334155;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --accent: #10b981;
        --accent-glow: rgba(16, 185, 129, 0.15);
        --purple: #8b5cf6;
        --danger: #ef4444;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 380px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        font-size: 13px;
        color: var(--text-main);
        background-color: var(--bg-color);
        line-height: 1.5;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        background: rgba(30, 41, 59, 0.8);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--card-border);
      }

      .brand-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header-actions {
        display: flex;
        gap: 8px;
      }

      .btn {
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .btn-primary {
        background: var(--primary);
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
      }

      .btn-icon {
        background: var(--card-bg);
        color: var(--text-muted);
        border: 1px solid var(--card-border);
        padding: 6px;
        border-radius: 8px;
      }

      .btn-icon:hover {
        color: var(--text-main);
        border-color: var(--text-muted);
      }

      nav {
        display: flex;
        padding: 6px;
        margin: 10px 12px 0 12px;
        background: #1e293b;
        border-radius: 10px;
        border: 1px solid var(--card-border);
        gap: 4px;
      }

      .tab-btn {
        flex: 1;
        padding: 8px 0;
        border: none;
        border-radius: 7px;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: all 0.2s ease;
        text-align: center;
      }

      .tab-btn.active {
        background: var(--primary);
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
      }

      main {
        padding: 14px;
        min-height: 220px;
      }

      .hidden {
        display: none !important;
      }

      .status-box {
        text-align: center;
        padding: 30px 16px;
        color: var(--text-muted);
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 12px auto;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .status-note {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 10px;
        text-align: right;
      }

      .error-box {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        padding: 12px;
        border-radius: 8px;
        font-size: 12px;
        margin-bottom: 12px;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }

      .card-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .price-badge {
        display: inline-block;
        padding: 2px 8px;
        background: rgba(59, 130, 246, 0.15);
        color: #60a5fa;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
      }

      .deal-hero {
        background: linear-gradient(
          135deg,
          rgba(16, 185, 129, 0.12) 0%,
          rgba(59, 130, 246, 0.12) 100%
        );
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .savings-tag {
        background: var(--accent);
        color: #022c22;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 11px;
      }

      a.text-link {
        color: #60a5fa;
        text-decoration: none;
        transition: color 0.2s ease;
      }

      a.text-link:hover {
        color: #93c5fd;
        text-decoration: underline;
      }

      .match-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }

      .match-item:last-child {
        border-bottom: none;
      }

      .store-tag {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        background: #334155;
        color: var(--text-muted);
      }

      .spec-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 8px;
      }

      .spec-item {
        background: rgba(15, 23, 42, 0.6);
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .spec-label {
        font-size: 10px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .spec-val {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-main);
        margin-top: 2px;
      }

      .api-config {
        margin-top: 14px;
        padding: 12px;
        background: rgba(15, 23, 42, 0.5);
        border-radius: 8px;
        border: 1px dashed var(--card-border);
      }

      .api-config input {
        width: 100%;
        padding: 7px 10px;
        border-radius: 6px;
        border: 1px solid var(--card-border);
        background: #0f172a;
        color: var(--text-main);
        font-size: 12px;
        margin-top: 6px;
        margin-bottom: 8px;
      }

      .empty-state {
        text-align: center;
        padding: 30px 10px;
        color: var(--text-muted);
      }

      .saved-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        margin-bottom: 8px;
      }

      .btn-delete {
        background: transparent;
        color: #ef4444;
        border: none;
        cursor: pointer;
        padding: 4px 8px;
        font-size: 12px;
        border-radius: 4px;
      }

      .btn-delete:hover {
        background: rgba(239, 68, 68, 0.15);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand-logo">
        <span>⚡ Specz Nepal</span>
      </div>
      <div class="header-actions">
        <button id="analyzeBtn" class="btn btn-primary">🔍 Re-Analyze</button>
      </div>
    </header>

    <nav>
      <button id="tabCompare" class="tab-btn active" data-tab="compare">
        Compare
      </button>
      <button id="tabAI" class="tab-btn" data-tab="ai">AI Insights</button>
      <button id="tabSaved" class="tab-btn" data-tab="saved">Wishlist</button>
    </nav>

    <main>
      <div id="statusNote" class="status-note">Initializing…</div>

      <div id="loading" class="status-box">
        <div class="spinner"></div>
        <p>Analyzing laptop specs & price deals…</p>
      </div>

      <div id="error" class="hidden error-box"></div>

      <div id="compareView" class="hidden"></div>
      <div id="aiView" class="hidden"></div>
      <div id="savedView" class="hidden">
        <div id="savedList"></div>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
